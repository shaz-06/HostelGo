<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <!-- Background Blob -->
  <path d="M30,80 C20,40 55,20 100,20 C145,20 180,40 170,80 C160,120 135,135 100,135 C55,135 40,120 30,80 Z" fill="#f0fdf4" />
  
  <!-- Floating Sparkles (Yellow #F59E0B) -->
  <path d="M42,38 L45,43 L50,44 L45,47 L42,52 L39,47 L34,44 L39,43 Z" fill="#F59E0B" />
  <path d="M168,88 L170,91 L173,92 L170,94 L168,98 L166,94 L163,92 L166,91 Z" fill="#F59E0B" opacity="0.8" />
  
  <!-- Friendly Character -->
  <!-- Body/Shirt (Buyto Green #318616) -->
  <path d="M52,125 C52,100 68,90 85,90 C102,90 118,100 118,125 Z" fill="#318616" />
  
  <!-- Neck -->
  <rect x="80" y="78" width="10" height="15" fill="#fed7aa" rx="2" />
  
  <!-- Head -->
  <circle cx="85" cy="65" r="22" fill="#fed7aa" />
  
  <!-- Hair (Dark grey #374151) -->
  <path d="M63,60 C63,40 75,36 85,38 C95,36 107,40 107,60 C107,63 104,50 85,50 C66,50 63,63 63,60 Z" fill="#374151" />
  
  <!-- Eyes -->
  <circle cx="78" cy="61" r="2" fill="#1f2937" />
  <circle cx="92" cy="61" r="2" fill="#1f2937" />
  
  <!-- Friendly Smile -->
  <path d="M79,70 Q85,76 91,70" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round" />
  
  <!-- Smartphone (Slightly rotated) -->
  <g transform="rotate(-6, 130, 85)">
    <!-- Phone Base -->
    <rect x="112" y="50" width="36" height="70" rx="6" fill="#1f2937" />
    <!-- Screen -->
    <rect x="115" y="54" width="30" height="62" rx="3" fill="#ffffff" />
    
    <!-- Shield / Security check inside screen -->
    <path d="M122,70 C122,70 130,67 130,67 C130,67 138,70 138,70 C138,78 130,85 130,85 C130,85 122,78 122,70 Z" fill="#F59E0B" />
    <!-- Checkmark on shield -->
    <path d="M126,76 L129,79 L134,73" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Hand holding phone -->
  <path d="M102,96 C106,96 112,94 116,92 L116,99 C112,102 106,102 102,102 Z" fill="#fed7aa" />
  <circle cx="114" cy="90" r="4.5" fill="#fed7aa" />
  <circle cx="116" cy="96" r="4.5" fill="#fed7aa" />
  <circle cx="115" cy="102" r="4" fill="#fed7aa" />
  
  <!-- Floating Green Shield badge on the right -->
  <g transform="translate(148, 25)">
    <path d="M0,8 C0,8 10,4 10,4 C10,4 20,8 20,8 C20,16 10,24 10,24 C10,24 0,16 0,8 Z" fill="#318616" />
    <path d="M5,12 L8,15 L15,8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
